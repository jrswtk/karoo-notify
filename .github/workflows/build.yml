name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      # karoo-ext jest w GitHub Packages – token z Actions wystarcza do odczytu
      GPR_USER: ${{ github.actor }}
      GPR_KEY: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :phone:assembleRelease :karoo:assembleRelease --stacktrace
          mkdir -p out
          cp phone/build/outputs/apk/release/phone-release.apk out/karoo-notify-phone.apk
          cp karoo/build/outputs/apk/release/karoo-release.apk out/karoo-notify-karoo.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: karoo-notify-apks
          path: out/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          make_latest: true
