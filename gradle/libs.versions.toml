kotlin = "2.0.0"
coreKtx = "1.13.1"
coroutines = "1.8.0"
karooExt = "1.1.9"

[libraries]
hammerhead-karoo-ext = { group = "io.hammerhead", name = "karoo-ext", version.ref = "karooExt" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
